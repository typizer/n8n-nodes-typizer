# Publishes n8n-nodes-typizer to npm with a provenance statement on every version tag.
# This file takes effect in the package's own public repository (github.com/typizer/n8n-nodes-typizer),
# which n8n's community-node verification requires; inside the Typizer monorepo it is inert.
#
# One-time setup on npmjs.com: package → Settings → Trusted Publishers → GitHub Actions,
# repository typizer/n8n-nodes-typizer, workflow publish.yml. No NPM_TOKEN secret is needed.
name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm publish --provenance --access public
